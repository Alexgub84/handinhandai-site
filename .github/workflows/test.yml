name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock
        env:
          # @alexgub84/whatsapp-chat-mock lives in a separate repo's GitHub
          # Packages registry. The auto secrets.GITHUB_TOKEN only has
          # read:packages on packages owned by THIS repo and 403s cross-repo.
          # Use the NPM_TOKEN PAT (read:packages on @alexgub84/*).
          GITHUB_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test
