name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned: ubuntu-latest now resolves to 26.04, which has no Playwright
    # Chromium build yet. Unpin once Playwright ships a chromium build for
    # the newer Ubuntu image.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test
