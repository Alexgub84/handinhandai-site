<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>OG Image Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px 0;
            display: block;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Hand in Hand AI - OG Image Generator</h1>
    
    <div>
        <button onclick="generateHome()">Generate Home OG</button>
        <button onclick="generatePrivacy()">Generate Privacy OG</button>
        <button onclick="generateDefault()">Generate Default OG</button>
    </div>

    <canvas id="canvas" width="1200" height="630"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function drawGradientBackground(colors) {
            // Create a subtle gradient background
            const gradient = ctx.createLinearGradient(0, 0, 1200, 630);
            gradient.addColorStop(0, colors[0]);
            gradient.addColorStop(0.5, colors[1]);
            gradient.addColorStop(1, colors[2]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1200, 630);
            
            // Add subtle overlay pattern
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let i = 0; i < 20; i++) {
                ctx.fillRect(i * 60, 0, 30, 630);
            }
        }

        function drawLogo(x, y) {
            // Simple hand icon representation
            ctx.fillStyle = 'white';
            ctx.font = 'bold 40px Arial';
            ctx.fillText('🤝', x, y);
        }

        function wrapText(text, x, y, maxWidth, lineHeight, align = 'center') {
            ctx.textAlign = align;
            const words = text.split(' ');
            let line = '';
            const lines = [];

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            lines.forEach((line, index) => {
                ctx.fillText(line, x, y + (index * lineHeight));
            });

            return lines.length * lineHeight;
        }

        function generateHome() {
            // Clear canvas
            ctx.clearRect(0, 0, 1200, 630);
            
            // Background gradient
            drawGradientBackground(['#1e40af', '#6d28d9', '#059669']);
            
            // Semi-transparent overlay for better text readability
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, 1200, 630);
            
            // Logo and brand name
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'right';
            ctx.fillText('Hand in Hand AI', 1080, 120);
            
            // Main Hebrew tagline
            ctx.fillStyle = 'white';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            wrapText('תפסיקו לרוץ אחרי המערכות,', 600, 280, 900, 80, 'center');
            wrapText('תתחילו לנהל עסק', 600, 360, 900, 80, 'center');
            
            // Subtitle
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.font = '36px Arial';
            ctx.fillText('צוות AI מותאם אישית שעובד מסביב לשעון', 600, 480);
            
            // Accent line
            ctx.fillStyle = '#10B981';
            ctx.fillRect(300, 520, 600, 4);
            
            downloadImage('home');
        }

        function generatePrivacy() {
            // Clear canvas
            ctx.clearRect(0, 0, 1200, 630);
            
            // Simple clean background
            const gradient = ctx.createLinearGradient(0, 0, 0, 630);
            gradient.addColorStop(0, '#1e3a8a');
            gradient.addColorStop(1, '#1e40af');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1200, 630);
            
            // Logo and brand name
            ctx.fillStyle = 'white';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'right';
            ctx.fillText('Hand in Hand AI', 1080, 120);
            
            // Main title
            ctx.fillStyle = 'white';
            ctx.font = 'bold 72px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Privacy Policy', 600, 300);
            
            // Separator
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillRect(400, 340, 400, 2);
            
            // Subtitle
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = '40px Arial';
            ctx.fillText('Hand in Hand AI', 600, 420);
            
            downloadImage('privacy');
        }

        function generateDefault() {
            // Clear canvas
            ctx.clearRect(0, 0, 1200, 630);
            
            // Background gradient - more subtle than home
            drawGradientBackground(['#1e40af', '#4f46e5', '#2563eb']);
            
            // Semi-transparent overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, 1200, 630);
            
            // Logo and brand name - larger and centered
            ctx.fillStyle = 'white';
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Hand in Hand AI', 600, 280);
            
            // Tagline
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.font = '42px Arial';
            ctx.fillText('עוזר AI בווטסאפ לסטודיו בוטיק', 600, 380);
            
            // Accent decoration
            ctx.fillStyle = '#10B981';
            ctx.beginPath();
            ctx.arc(600, 480, 60, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px Arial';
            ctx.fillText('AI', 600, 495);
            
            downloadImage('default');
        }

        function downloadImage(name) {
            // Convert canvas to blob and download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `og-${name}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/jpeg', 0.85);
        }
    </script>
</body>
</html>
