<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;flex-direction:column;gap:14px;font:var(--hiha-p);color:var(--hiha-fg-subtle)}
  .r{display:flex;align-items:center;gap:18px}
  .demo-shadow-sm{width:140px;height:46px;border-radius:32px;background:#fff;box-shadow:var(--hiha-shadow-sm)}
  .demo-shadow-card{width:140px;height:46px;border-radius:8px;background:#fff;box-shadow:var(--hiha-shadow-card)}
  .demo-radius{display:flex;gap:10px}
  .pip{width:50px;height:50px;background:var(--hiha-green-soft);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--hiha-fg-strong)}
</style></head><body>
<div class="r"><div class="demo-shadow-sm"></div><span>shadow-sm · pill / lang switcher</span></div>
<div class="r"><div class="demo-shadow-card"></div><span>shadow-card · floating tool chip</span></div>
<div class="r"><div class="demo-radius">
  <div class="pip" style="border-radius:4px">4</div>
  <div class="pip" style="border-radius:8px">8</div>
  <div class="pip" style="border-radius:16px">16</div>
  <div class="pip" style="border-radius:24px">24</div>
  <div class="pip" style="border-radius:32px">32</div>
  <div class="pip" style="border-radius:64px">64</div>
</div><span>Radii · pills (32/64) are signature</span></div>
</body></html>
