<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;gap:16px;flex-wrap:wrap}
  .step{width:340px;padding:19px 21px;border-radius:8px;background:linear-gradient(180deg,var(--hiha-green-soft) 0%,#fff 100%);border:1px solid var(--hiha-green);display:flex;align-items:center;gap:28px}
  .num{width:40px;height:40px;border-radius:50%;background:var(--hiha-green);color:#ECFBFF;display:flex;align-items:center;justify-content:center;font:700 24px/30px var(--hiha-font-display)}
  .label{font:var(--hiha-h5);color:var(--hiha-fg-strong)}
  .toolchip{position:relative;width:160px;height:44px;border-radius:4px;background:#fff;box-shadow:var(--hiha-shadow-card);font:400 16px/44px var(--hiha-font-ui);color:#3C3C3C;padding-left:20px;overflow:hidden}
  .toolchip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.4px;background:var(--hiha-green-glow);border-radius:4px}
</style></head><body>
  <div class="step"><div class="num">1</div><div class="label">Getting to know your Business</div></div>
  <div class="toolchip">Automate CRM</div>
  <div class="toolchip">Generate Reports</div>
  <div class="toolchip">Auto Replies</div>
</body></html>
