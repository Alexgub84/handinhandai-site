<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;gap:16px;flex-wrap:wrap}
  .frame{width:200px;height:140px;background:#fff;border:8px solid var(--hiha-card-mint-border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--hiha-fg-faint);font:var(--hiha-p-sm)}
  .testi{width:280px;padding:16px 22px;background:#fff;border:1px solid rgba(147,200,62,0.5);border-radius:16px;display:flex;flex-direction:column;gap:14px}
  .stars{display:flex;gap:4px}.stars img{width:18px;height:18px}
  .quote{font:500 16px/22px var(--hiha-font-body);color:var(--hiha-fg-strong)}
  .who{font:var(--hiha-p-sm);color:var(--hiha-fg-subtle)}
  .userpaincard{width:280px;padding:16px 22px;background:#fff;border:1px solid rgba(255,153,0,0.5);border-radius:16px;display:flex;flex-direction:column;gap:12px}
  .upchip{align-self:flex-start;padding:4px 16px;border-radius:32px;background:var(--hiha-orange);color:#fff;font:500 10px/16px var(--hiha-font-body);letter-spacing:.04em}
  .upttl{font:var(--hiha-h4);color:var(--hiha-fg-strong)}
</style></head><body>
  <div class="frame">8px mint frame · radius 8</div>
  <div class="testi">
    <div class="stars"><img src="../assets/star.png"><img src="../assets/star.png"><img src="../assets/star.png"><img src="../assets/star.png"><img src="../assets/star.png"></div>
    <div class="quote">He really understands our business and our problems.</div>
    <div class="who">Simon Clark</div>
  </div>
  <div class="userpaincard">
    <span class="upchip">USER PAIN</span>
    <div class="upttl">Missed Inquiries</div>
    <div style="font:var(--hiha-p);color:var(--hiha-fg-subtle)">AI chatbot that talks to customers on WhatsApp, Instagram or the website.</div>
  </div>
</body></html>
