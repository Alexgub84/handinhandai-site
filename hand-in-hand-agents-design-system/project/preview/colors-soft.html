<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px;width:120px}
  .chip{height:64px;border-radius:8px;border:1px solid var(--hiha-border)}
  .lab{font:var(--hiha-p-sm);color:var(--hiha-fg-strong);font-weight:500}
  .hex{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--hiha-fg-subtle)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--hiha-green-soft)"></div><div class="lab">Green soft</div><div class="hex">#D9EEDA</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-green-mid)"></div><div class="lab">Green mid</div><div class="hex">#B4E0B9</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-orange-soft)"></div><div class="lab">Orange soft</div><div class="hex">#F3C79A</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-blue-soft)"></div><div class="lab">Blue soft</div><div class="hex">#5FA8FF</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-shade-gradient)"></div><div class="lab">Shade blob</div><div class="hex">25% mint→sky→peach</div></div>
</div></body></html>
