<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;flex-direction:column;gap:12px;font:var(--hiha-p);color:var(--hiha-fg-subtle)}
  .row{display:flex;gap:14px;align-items:center}
  .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--hiha-border)}
  .ic.dark{background:var(--hiha-cta-gradient);border:0}
  .ic img{width:24px;height:24px}
  .ic.dark img{filter:brightness(0) invert(1)}
  .lab{font:var(--hiha-p-sm);color:var(--hiha-fg-strong);font-weight:500;width:140px}
  .meta{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--hiha-fg-subtle)}
</style></head><body>
<div class="row"><div class="ic dark"><img src="../assets/icon-whatsapp.svg" alt=""></div><span class="lab">WhatsApp · solid</span><span class="meta">primary CTA</span></div>
<div class="row"><div class="ic"><img src="../assets/icon-call.svg" alt=""></div><span class="lab">Phone · solid</span><span class="meta">secondary CTA</span></div>
<div class="row"><div class="ic"><img src="../assets/star.png" alt=""></div><span class="lab">Star</span><span class="meta">testimonial rating</span></div>
<div class="row"><span class="lab" style="width:auto;padding-left:8px">EN 🇬🇧 / HE 🇮🇱</span><span class="meta">only emoji used in product</span></div>
<div class="row"><span class="meta" style="padding-left:8px">→ Lucide @ 24px stroke 1.5 recommended for new icons (substitution; flag with team)</span></div>
</body></html>
