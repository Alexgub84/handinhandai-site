<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px;width:118px}
  .chip{height:56px;border-radius:8px;border:1px solid var(--hiha-border)}
  .lab{font:var(--hiha-p-sm);color:var(--hiha-fg-strong);font-weight:500}
  .hex{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--hiha-fg-subtle)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--hiha-fg-strong)"></div><div class="lab">fg-strong</div><div class="hex">#1A2842</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-fg)"></div><div class="lab">fg</div><div class="hex">#202939</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-fg-muted)"></div><div class="lab">fg-muted</div><div class="hex">#364152</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-fg-subtle)"></div><div class="lab">fg-subtle</div><div class="hex">#697586</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-fg-faint)"></div><div class="lab">fg-faint</div><div class="hex">#8590A2</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-bg-footer)"></div><div class="lab">footer bg</div><div class="hex">#121212</div></div>
</div></body></html>
