<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font:var(--hiha-p);}
  .row{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px;width:120px}
  .chip{height:84px;border-radius:8px;border:1px solid var(--hiha-border)}
  .lab{font:var(--hiha-p-sm);color:var(--hiha-fg-strong);font-weight:500}
  .hex{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--hiha-fg-subtle)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--hiha-green)"></div><div class="lab">Green / Primary</div><div class="hex">#93C83E · rgb(147,200,62)</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-orange)"></div><div class="lab">Orange / Secondary</div><div class="hex">#FF9900 · rgb(255,153,0)</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-cta-gradient)"></div><div class="lab">CTA gradient</div><div class="hex">green→orange, vertical</div></div>
  <div class="sw"><div class="chip" style="background:var(--hiha-blue)"></div><div class="lab">Blue / Tertiary</div><div class="hex">#006BFF · rgb(0,107,255)</div></div>
</div></body></html>
