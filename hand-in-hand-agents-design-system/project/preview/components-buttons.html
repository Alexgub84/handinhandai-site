<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font:var(--hiha-p)}
  .r{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .btn-primary{display:inline-flex;gap:8px;align-items:center;padding:12px 24px;border-radius:32px;background:var(--hiha-cta-gradient);color:#fff;font:500 16px/24px var(--hiha-font-body);border:0;cursor:pointer}
  .btn-primary img{width:24px;height:24px;filter:brightness(0) invert(1)}
  .btn-secondary{display:inline-flex;gap:8px;align-items:center;padding:12px 24px;border-radius:32px;background:#fff;border:1px solid var(--hiha-border);color:#000;font:500 16px/24px var(--hiha-font-body);cursor:pointer}
  .btn-secondary img{width:18px;height:18px}
  .btn-lang{display:inline-flex;gap:8px;align-items:center;padding:8px 24px;border-radius:32px;background:#fff;border:1px solid #fff;box-shadow:var(--hiha-shadow-sm);color:var(--hiha-fg-muted);font:500 16px/24px var(--hiha-font-body)}
</style></head><body>
<div class="r">
  <button class="btn-primary"><img src="../assets/icon-whatsapp.svg" alt="">Talk to Us</button>
  <button class="btn-secondary"><img src="../assets/icon-call.svg" alt="">Schedule a Call</button>
  <button class="btn-lang">EN 🇬🇧 <span style="color:var(--hiha-fg-subtle)">⌄</span></button>
</div>
</body></html>
