<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Studio Landing — Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="landing.css">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  /* Inside an artboard, anchor the page surface and let it grow tall. */
  .fs-canvas-host { width: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="landing-page.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showDesktop": true,
  "showBold":    true,
  "accent":      "green"
}/*EDITMODE-END*/;

const ACCENTS = {
  green:  { hex: "#93C83E", strong: "#6FB133" },
  orange: { hex: "#FF9900", strong: "#E08600" },
  blue:   { hex: "#006BFF", strong: "#0055CC" },
  navy:   { hex: "#1A2842", strong: "#0E1A33" },
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply accent live to the page surface tokens
  React.useEffect(() => {
    const a = ACCENTS[t.accent] || ACCENTS.green;
    const r = document.documentElement;
    r.style.setProperty("--fs-accent", a.hex);
    r.style.setProperty("--fs-accent-strong", a.strong);
  }, [t.accent]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="calm" title="A · Calm + Premium" subtitle="Warm sand, generous whitespace. Feels confident, not loud.">
          <DCArtboard id="calm-mobile" label="Mobile · 390" width={390} height={2400}>
            <div className="fs-canvas-host"><LandingPage variant="calm" device="mobile" /></div>
          </DCArtboard>
          {t.showDesktop && (
            <DCArtboard id="calm-desk" label="Desktop · 1280" width={1280} height={3200}>
              <div className="fs-canvas-host"><LandingPage variant="calm" device="desk" /></div>
            </DCArtboard>
          )}
        </DCSection>

        {t.showBold && (
          <DCSection id="bold" title="B · Bold + Editorial" subtitle="Charcoal surface, accent type. For owners who want to feel like the studio is a brand.">
            <DCArtboard id="bold-mobile" label="Mobile · 390" width={390} height={2400}>
              <div className="fs-canvas-host"><LandingPage variant="bold" device="mobile" /></div>
            </DCArtboard>
            {t.showDesktop && (
              <DCArtboard id="bold-desk" label="Desktop · 1280" width={1280} height={3200}>
                <div className="fs-canvas-host"><LandingPage variant="bold" device="desk" /></div>
              </DCArtboard>
            )}
          </DCSection>
        )}

        <DCPostIt x={40} y={20} width={300}>
          {`Mock slots in §1, §3, §5 are reserved.\nReal interactive WhatsApp mocks plug in later — keep the dashed phone-frame placeholder for now.`}
        </DCPostIt>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Variants" />
        <TweakToggle label="Show desktop frames" value={t.showDesktop}
                     onChange={(v) => setTweak('showDesktop', v)} />
        <TweakToggle label="Show bold direction"  value={t.showBold}
                     onChange={(v) => setTweak('showBold', v)} />
        <TweakSection label="Accent" />
        <TweakRadio label="Color" value={t.accent}
                    options={['green','orange','blue','navy']}
                    onChange={(v) => setTweak('accent', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
